name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-go@v5.5.0
        with:
          go-version-file: go.mod
      - run: make check
      # Frame cost is also asserted as a 5 ms budget inside make check; this
      # step prints the measured busy and 500-PR frame numbers in the log.
      - run: go test ./internal/scene -run '^$' -bench 'BenchmarkBusyFrame|BenchmarkScaleFrame' -benchtime=200x -benchmem
